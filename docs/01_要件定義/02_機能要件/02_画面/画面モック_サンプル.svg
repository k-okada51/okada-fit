<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="sans-serif" font-size="13">
  <rect x="0.5" y="0.5" width="639" height="379" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <!-- title bar -->
  <text x="20" y="30" font-size="15" font-weight="700" fill="#0f172a">申込一覧（SCR-01・低忠実ワイヤー）</text>
  <line x1="0" y1="46" x2="640" y2="46" stroke="#e2e8f0"/>
  <!-- toolbar -->
  <rect x="20" y="62" width="220" height="34" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="34" y="84" fill="#94a3b8">🔍 宛先・申込#で検索</text>
  <rect x="252" y="62" width="120" height="34" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="266" y="84" fill="#475569">状態で絞込 ▾</text>
  <rect x="486" y="62" width="134" height="34" rx="6" fill="#1e293b"/>
  <text x="504" y="84" fill="#ffffff">＋ 新規申込</text>
  <!-- table header -->
  <rect x="20" y="112" width="600" height="34" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="34" y="134" fill="#334155">☐</text>
  <text x="70" y="134" fill="#334155" font-weight="700">申込#</text>
  <text x="180" y="134" fill="#334155" font-weight="700">宛先（水道局）</text>
  <text x="400" y="134" fill="#334155" font-weight="700">状態</text>
  <text x="540" y="134" fill="#334155" font-weight="700">更新</text>
  <!-- rows -->
  <g fill="#475569">
    <line x1="20" y1="180" x2="620" y2="180" stroke="#eef2f6"/>
    <text x="34" y="170">☐</text><text x="70" y="170">1024</text><text x="180" y="170">A市 水道局</text>
    <rect x="400" y="156" width="78" height="20" rx="10" fill="#dcfce7"/><text x="410" y="170" fill="#166534" font-size="11">送信済</text>
    <text x="540" y="170">10:12</text>

    <line x1="20" y1="214" x2="620" y2="214" stroke="#eef2f6"/>
    <text x="34" y="204">☐</text><text x="70" y="204">1023</text><text x="180" y="204">B町 水道課</text>
    <rect x="400" y="190" width="78" height="20" rx="10" fill="#fef9c3"/><text x="410" y="204" fill="#854d0e" font-size="11">送信予約</text>
    <text x="540" y="204">10:03</text>

    <line x1="20" y1="248" x2="620" y2="248" stroke="#eef2f6"/>
    <text x="34" y="238">☐</text><text x="70" y="238">1022</text><text x="180" y="238">C市 上下水道局</text>
    <rect x="400" y="224" width="78" height="20" rx="10" fill="#fee2e2"/><text x="410" y="238" fill="#991b1b" font-size="11">エラー</text>
    <text x="540" y="238">09:58</text>
  </g>
  <!-- states note -->
  <line x1="0" y1="286" x2="640" y2="286" stroke="#e2e8f0"/>
  <text x="20" y="310" fill="#64748b" font-size="12">状態別: 空（0件メッセージ）／読込中（スケルトン）／エラー ERR-__（再試行）／権限なし（非表示）</text>
  <text x="20" y="332" fill="#64748b" font-size="12">状態バッジ色は 02_設計/60_テスト設計/02_RED母集合_受入基準・状態・エラー.md の ST を参照（送信済=緑／予約=黄／エラー=赤）</text>
  <text x="20" y="356" fill="#94a3b8" font-size="11">※これは低忠実ワイヤー。正本は src/mocks/SCR-01.tsx（shadcn/ui）＋本書のUX意図メモ。</text>
</svg>
